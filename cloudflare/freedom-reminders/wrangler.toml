name = "freedom-reminders"
main = "src/index.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# nodejs_compat: push library may fall back to node:crypto; Workers already have
# Web Crypto, but enabling this clears the deploy warning and keeps send paths safe.

# Live URL (do not rename Worker): https://freedom-reminders.dorothy-yakon.workers.dev
[[kv_namespaces]]
binding = "REMINDERS"
id = "6cd70d4f86d34240b2b2d0755ec058d7"
# Same namespace for local preview until a separate preview KV exists.
preview_id = "6cd70d4f86d34240b2b2d0755ec058d7"

[vars]
ALLOWED_ORIGIN = "https://yakon-dot.github.io"

# Runs near end of month; handler only sends on the actual last calendar day.
[triggers]
crons = ["0 17 28-31 * *"]

# Secrets — set in Cloudflare Dashboard (Encrypted) or via `wrangler secret put`.
# Never commit values. Rotate VAPID keys before first real deploy; do not reuse
# any private key that has appeared in chat.
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT   (mailto: you control)
#   ADMIN_TOKEN     (for POST /admin/test)
